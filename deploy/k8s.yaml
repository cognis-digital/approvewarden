apiVersion: apps/v1
kind: Deployment
metadata: { name: approvewarden, labels: { app: approvewarden } }
spec:
  replicas: 1
  selector: { matchLabels: { app: approvewarden } }
  template:
    metadata: { labels: { app: approvewarden } }
    spec:
      containers:
        - name: approvewarden
          image: ghcr.io/cognis-digital/approvewarden:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: approvewarden }
spec:
  selector: { app: approvewarden }
  ports: [{ port: 80, targetPort: 8000 }]
